<!DOCTYPE html>
<!-- 今日热搜 · 收藏页（F3 我的收藏 · Day 13 独立视图） -->
<!-- 用法：读 localStorage 的 favorites，渲染收藏的热搜卡片 -->
<!-- 四态（Day 13 板块③补齐）：加载中 → 正常（有收藏）/ 空（无收藏）/ 错误（本地存储不可用） -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的收藏 · 今日热搜</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 顶部：返回首页 + 面包屑（Day 13） -->
  <header class="site-header detail-header">
    <a class="back-link" href="index.html">&larr; 返回首页</a>
    <h1>我的收藏</h1>
  </header>

  <main>
    <!-- 面包屑（Day 13 加练）：首页 > 我的收藏 -->
    <nav class="breadcrumb" aria-label="面包屑">
      <a href="index.html">首页</a>
      <span aria-hidden="true">&gt;</span>
      <span aria-current="page">我的收藏</span>
    </nav>

    <!-- 收藏列表：main.js 按四态渲染（加载中 / 正常 / 空 / 错误） -->
    <section id="favorites-view" aria-label="我的收藏列表">
      <div id="fav-list-root">
        <p class="loading-tip">收藏加载中……</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>今日热搜 · 省流版演示 —— MVP 演示数据，非实时抓取</p>
  </footer>

  <!-- 脚本顺序与首页一致：数据 → 组件 → 逻辑 -->
  <script src="data.js"></script>
  <script src="components.js"></script>
  <script src="main.js"></script>
</body>
</html>
